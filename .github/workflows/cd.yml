name: 🚀 CD (Deploy to Production)

on:
  push:
    branches: ["main"]

concurrency:
  group: production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # =========================
  # 1️⃣ BUILD & PUSH DOCKER
  # =========================
  docker-build:
    name: Build & Push
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: backend
            context: ./n8n-server
            image: backend
          - name: frontend
            context: ./n8n-client
            image: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Create Production Env for Frontend
        if: matrix.name == 'frontend'
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > ./n8n-client/.env.production
          echo "✅ Created .env.production for frontend build"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================
  # 2️⃣ SECURITY SCAN
  # =========================
  image-scan:
    name: Trivy Scan
    runs-on: ubuntu-24.04
    needs: docker-build
    strategy:
      matrix:
        image_name: [backend, frontend]

    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # Cache Trivy vulnerability DB để tránh tải lại mỗi lần chạy
      # (tránh bị GitHub Container Registry rate-limit khi chạy nhiều lần/ngày về lâu dài)
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      - name: Scan image
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.53.0 image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image_name }}:${{ env.IMAGE_TAG }}

  # =========================
  # 3️⃣ DEPLOY (WITH ROLLBACK)
  # =========================
  deploy:
    name: Deploy with rollback
    runs-on: self-hosted
    needs: image-scan
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy with rollback
        run: |
          set -e
          mkdir -p /home/ubuntu/app
          cp docker-compose.prod.yml /home/ubuntu/app/
          cd /home/ubuntu/app

          setup_env() {
            if [ -f .env.production ]; then
              export $(grep -v '^#' .env.production | xargs)
              export JWT_SECRET=${JWT_SECRET_KEY:-$JWT_SECRET}
            fi
            export IMAGE_BACKEND="${{ secrets.DOCKER_USERNAME }}/backend"
            export IMAGE_FRONTEND="${{ secrets.DOCKER_USERNAME }}/frontend"
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
          }

          setup_env

          echo "Backup current version"
          # Backup theo image ID của container ĐANG chạy thật sự, không dựa vào tag ":latest"
          # local (tag này không được compose cập nhật vì deploy luôn pull theo SHA tag).
          if docker inspect n8n-backend >/dev/null 2>&1; then
            docker tag "$(docker inspect --format='{{.Image}}' n8n-backend)" backup-backend:latest
          else
            echo "No running backend container found, skipping backup."
          fi
          if docker inspect n8n-frontend >/dev/null 2>&1; then
            docker tag "$(docker inspect --format='{{.Image}}' n8n-frontend)" backup-frontend:latest
          else
            echo "No running frontend container found, skipping backup."
          fi

          echo "Deploying version: $IMAGE_TAG"
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --pull always

          echo "Waiting for app to stabilize (30s)..."
          sleep 30

          # HÀM ROLLBACK ĐỂ DÙNG CHUNG
          rollback() {
            echo "❌ $1"
            setup_env
            if docker image inspect backup-backend:latest >/dev/null 2>&1 && docker image inspect backup-frontend:latest >/dev/null 2>&1; then
              echo "Rolling back to previous version..."
              docker compose -f docker-compose.prod.yml down
              docker tag backup-backend:latest "$IMAGE_BACKEND:rollback"
              docker tag backup-frontend:latest "$IMAGE_FRONTEND:rollback"
              IMAGE_TAG=rollback docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            else
              echo "⚠️ No backup found (likely first deploy). Checking logs..."
              docker compose -f docker-compose.prod.yml logs --tail=50
            fi
            exit 1
          }

          # 1. Kiểm tra API qua Nginx (Đây là đường dẫn quan trọng nhất)
          echo "Checking API via Nginx (http://localhost:80/api/v1/health)..."
          if ! curl -sSf http://localhost:80/api/v1/health > /dev/null; then
            rollback "API Health Check via Nginx FAILED!"
          fi

          # 2. Kiểm tra Frontend (Trang chủ)
          echo "Checking Frontend UI (http://localhost:80)..."
          if ! curl -sSf http://localhost:80 > /dev/null; then
            rollback "Frontend UI FAILED!"
          fi

          echo "✅ Deploy successful!"

  # =========================
  # 4️⃣ NOTIFY
  # =========================
  notify:
    name: Notify
    runs-on: self-hosted
    needs: deploy
    # always() bỏ qua kết quả needs mặc định, nên phải tự loại trừ trường hợp deploy bị skip
    # (ví dụ khi docker-build hoặc image-scan fail khiến deploy không chạy)
    if: always() && needs.deploy.result != 'skipped'
    timeout-minutes: 2
    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Deploy Status: ${{ needs.deploy.result }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions
          secure: true
          body: |
            Status: ${{ needs.deploy.result }}
            Commit: ${{ github.sha }}
            Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
